apiVersion: apps/v1
kind: Deployment

metadata:
  name: production-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: production-cicd-app

  template:
    metadata:
      labels:
        app: production-cicd-app

    spec:
      containers:
        - name: production-cicd-app
          image: YOUR_ACCOUNT_ID.dkr.ecr.eu-north-1.amazonaws.com/production-cicd-platform:YOUR_IMAGE_TAG

          ports:
            - containerPort: 8000
